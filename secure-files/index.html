<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureFiles</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; font-size: 28px; color: #00d4ff; }
        .card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 24px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #00d4ff; }
        input[type="file"] { display: none; }
        .file-btn { display: block; width: 100%; padding: 16px; background: rgba(0,212,255,0.1); border: 2px dashed rgba(0,212,255,0.3); border-radius: 12px; text-align: center; cursor: pointer; color: #00d4ff; }
        .file-info { margin-top: 12px; padding: 12px; background: rgba(0,255,136,0.1); border-radius: 8px; font-size: 14px; color: #00ff88; }
        button { width: 100%; padding: 16px; background: linear-gradient(135deg, #00d4ff, #0099cc); border: none; border-radius: 10px; color: #000; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .link-result { margin-top: 16px; padding: 16px; background: rgba(0,255,136,0.1); border-radius: 10px; }
        .link-result a { color: #00ff88; word-break: break-all; display: block; margin-bottom: 12px; }
        .copy-btn { background: rgba(0,255,136,0.2); color: #00ff88; }
        .error { margin-top: 16px; padding: 16px; background: rgba(255,107,107,0.2); border-radius: 10px; color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SecureFiles</h1>
        <div class="card">
            <h2>Выберите файл</h2>
            <label class="file-btn" for="fileInput">Нажмите для выбора</label>
            <input type="file" id="fileInput" onchange="showFileInfo()">
            <div id="fileInfo" class="file-info" style="display:none;"></div>
        </div>
        <button id="uploadBtn" onclick="uploadFile()">Загрузить</button>
        <div id="error" class="error" style="display:none;"></div>
        <div id="linkResult" class="link-result" style="display:none;">
            <p style="color:#00ff88;margin-bottom:8px;">Ссылка для скачивания:</p>
            <a id="shareLink" href="#" target="_blank"></a>
            <button class="copy-btn" onclick="copyLink()">Копировать ссылку</button>
        </div>
    </div>
    <script>
        var selectedFile = null;

        function showFileInfo() {
            var input = document.getElementById('fileInput');
            if (input.files.length > 0) {
                selectedFile = input.files[0];
                var info = document.getElementById('fileInfo');
                info.style.display = 'block';
                info.textContent = 'Выбран: ' + selectedFile.name + ' (' + formatSize(selectedFile.size) + ')';
            }
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
            return (bytes/(1024*1024)).toFixed(1) + ' MB';
        }

        async function uploadFile() {
            if (!selectedFile) { alert('Выберите файл!'); return; }

            var btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.textContent = 'Загрузка...';

            try {
                // Try 0x0.st first
                var formData = new FormData();
                formData.append('file', selectedFile);

                var response = await fetch('https://0x0.st', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Upload failed');

                var link = await response.text();
                link = link.trim();

                if (link.startsWith('http')) {
                    document.getElementById('error').style.display = 'none';
                    document.getElementById('linkResult').style.display = 'block';
                    document.getElementById('shareLink').href = link;
                    document.getElementById('shareLink').textContent = link;
                } else {
                    throw new Error('Invalid response');
                }
            } catch (e) {
                var errorDiv = document.getElementById('error');
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Ошибка: ' + e.message;
                document.getElementById('linkResult').style.display = 'none';
            }

            btn.disabled = false;
            btn.textContent = 'Загрузить';
        }

        function copyLink() {
            var link = document.getElementById('shareLink').textContent;
            navigator.clipboard.writeText(link).then(function() { alert('Скопировано!'); });
        }
    </script>
</body>
</html>
