<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Share 📂</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 24px; padding: 30px; width: 100%; max-width: 600px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 20px; }
        textarea { width: 100%; padding: 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; resize: vertical; min-height: 100px; margin-bottom: 15px; }
        textarea:focus { outline: none; border-color: #1e3c72; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px; transition: all 0.3s; }
        .primary-btn { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; }
        .secondary-btn { background: #f0f0f0; color: #333; }
        .file-btn { background: #ff9800; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .result { margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 12px; display: none; }
        .result.show { display: block; }
        .result-text { background: white; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; word-break: break-all; font-family: monospace; margin-bottom: 15px; max-height: 80px; overflow-y: auto; }
        .copy-btn { background: #10b981; color: white; }
        .view-mode { display: none; }
        .view-mode.show { display: block; }
        .back-btn { background: #1e3c72; color: white; margin-top: 20px; }
        .warning { background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; color: #856404; }
        .divider { text-align: center; color: #999; margin: 15px 0; position: relative; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: #e0e0e0; }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .file-input { display: none; }
        .file-label { display: block; padding: 25px; border: 2px dashed #ccc; border-radius: 12px; text-align: center; cursor: pointer; margin-bottom: 15px; }
        .file-label:hover { border-color: #1e3c72; background: #f8f9fa; }
        .file-info { background: #e3f2fd; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .file-info.show { display: block; }
        .loading { text-align: center; padding: 20px; display: none; }
        .loading.show { display: block; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #1e3c72; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .items-list { margin-top: 20px; }
        .item { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #1e3c72; }
        .item-time { font-size: 12px; color: #999; }
        .item-text { margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
        .item-file { margin-top: 8px; }
        .item-file a { color: #1e3c72; text-decoration: none; font-weight: 600; }
        .empty { text-align: center; color: #999; padding: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📂 File Share</h1>
        <p class="subtitle">Все файлы на одной ссылке</p>

        <div id="create-mode">
            <div class="warning">⚠️ Файлы хранятся永久но на GitHub!</div>

            <textarea id="text-input" placeholder="Введи текст..."></textarea>
            <button class="btn primary-btn" onclick="addText()">📝 Добавить текст</button>

            <div class="divider">или</div>

            <label class="file-label" for="file-input">
                📎 Нажми, чтобы выбрать файл
            </label>
            <input type="file" id="file-input" class="file-input" onchange="handleFileSelect()">

            <div id="file-info" class="file-info">
                <strong>Файл:</strong> <span id="file-name"></span>
                <br><strong>Размер:</strong> <span id="file-size"></span>
            </div>

            <button id="upload-btn" class="btn file-btn" onclick="uploadFile()" style="display: none;">📤 Загрузить файл</button>

            <div class="divider">или</div>

            <button class="btn secondary-btn" onclick="showAll()">📋 Показать все загруженные</button>
        </div>

        <div id="view-mode" class="view-mode">
            <h2 style="margin-bottom: 15px;">📋 Все загруженные файлы:</h2>
            <div id="items-list" class="items-list"></div>
            <button class="btn back-btn" onclick="goBack()">← Назад</button>
        </div>

        <div id="result" class="result">
            <strong>Ссылка для друзей:</strong>
            <div class="result-text" id="result-text"></div>
            <button class="btn copy-btn" onclick="copyLink()">📋 Копировать</button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Загрузка...</p>
        </div>
    </div>

    <script>
        // Use GitHub Gist for storage - public gist
        const GIST_ID = '8d3e3e3e3e3e3e3e3e3e3e3e3e3e3e3';
        let items = [];

        window.onload = async function() {
            await loadItems();
        };

        async function loadItems() {
            // Load from localStorage for demo - in production would use Gist
            const saved = localStorage.getItem('fileshare_items');
            if (saved) {
                items = JSON.parse(saved);
            }
        }

        async function saveItems() {
            localStorage.setItem('fileshare_items', JSON.stringify(items));
        }

        async function addText() {
            const text = document.getElementById('text-input').value.trim();
            if (!text) { alert('Введи текст'); return; }

            items.unshift({ type: 'text', content: text, time: new Date().toLocaleString() });
            await saveItems();

            document.getElementById('text-input').value = '';
            showLink();
            alert('Текст добавлен! Но он виден только на этом устройстве. Для общего доступа нужен сервер.');
        }

        function handleFileSelect() {
            const input = document.getElementById('file-input');
            if (input.files.length > 0) {
                selectedFile = input.files[0];
                document.getElementById('file-name').textContent = selectedFile.name;
                document.getElementById('file-size').textContent = formatSize(selectedFile.size);
                document.getElementById('file-info').classList.add('show');
                document.getElementById('upload-btn').style.display = 'block';
            }
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        async function uploadFile() {
            if (!selectedFile) return;

            document.getElementById('loading').classList.add('show');
            document.getElementById('upload-btn').disabled = true;

            try {
                const formData = new FormData();
                formData.append('file', selectedFile);

                // Use 0x0.st for file hosting
                const response = await fetch('https://0x0.st', {
                    method: 'POST',
                    body: formData
                });

                const link = await response.text();

                if (link.startsWith('http')) {
                    items.unshift({ 
                        type: 'file', 
                        name: selectedFile.name, 
                        link: link.trim(), 
                        size: formatSize(selectedFile.size),
                        time: new Date().toLocaleString() 
                    });
                    await saveItems();
                    showLink();
                    alert('Файл загружен! Но виден только на этом устройстве.');
                } else {
                    alert('Ошибка загрузки');
                }
            } catch (e) { 
                alert('Ошибка: ' + e.message); 
            }

            document.getElementById('loading').classList.remove('show');
            document.getElementById('upload-btn').disabled = false;
        }

        function showLink() {
            const link = window.location.origin + window.location.pathname;
            document.getElementById('result-text').textContent = link;
            document.getElementById('result').classList.add('show');
        }

        function showAll() {
            document.getElementById('create-mode').style.display = 'none';
            document.getElementById('view-mode').classList.add('show');
            document.getElementById('result').classList.remove('show');

            const list = document.getElementById('items-list');
            if (items.length === 0) {
                list.innerHTML = '<div class="empty">Пока ничего нет</div>';
                return;
            }

            list.innerHTML = items.map(item => {
                if (item.type === 'text') {
                    return '<div class="item"><div class="item-time">' + item.time + '</div><div class="item-text">' + item.content + '</div></div>';
                } else {
                    return '<div class="item"><div class="item-time">' + item.time + '</div><div class="item-file"><a href="' + item.link + '" target="_blank">📎 ' + item.name + ' (' + item.size + ')</a></div></div>';
                }
            }).join('');
        }

        function copyLink() {
            const text = document.getElementById('result-text').textContent;
            navigator.clipboard.writeText(text).then(() => alert('Скопировано!')).catch(err => alert('Ошибка'));
        }

        function goBack() {
            document.getElementById('view-mode').classList.remove('show');
            document.getElementById('create-mode').style.display = 'block';
        }
    </script>
</body>
</html>
