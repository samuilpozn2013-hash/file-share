<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Share 📂</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 24px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        textarea { width: 100%; padding: 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; resize: vertical; min-height: 150px; }
        textarea:focus { outline: none; border-color: #1e3c72; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 15px; transition: all 0.3s; }
        .primary-btn { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; }
        .secondary-btn { background: #f0f0f0; color: #333; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); }
        .result { margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 12px; display: none; }
        .result.show { display: block; }
        .result-text { background: white; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; word-break: break-all; font-family: monospace; margin-bottom: 15px; max-height: 100px; overflow-y: auto; }
        .copy-btn { background: #10b981; color: white; }
        .view-mode { display: none; }
        .view-mode.show { display: block; }
        .shared-content { background: #e8f5e9; padding: 20px; border-radius: 12px; margin-top: 20px; white-space: pre-wrap; word-break: break-word; }
        .back-btn { background: #1e3c72; color: white; margin-top: 20px; }
        .warning { background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; color: #856404; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📂 File Share</h1>
        <p class="subtitle">Делиться текстом легко</p>
        <div id="create-mode">
            <div class="warning">⚠️ Ссылка содержит весь текст. Не передавай чувствительные данные!</div>
            <textarea id="text-input" placeholder="Введи текст для передачи..."></textarea>
            <button class="btn primary-btn" onclick="createLink()">Создать ссылку</button>
            <button class="btn secondary-btn" onclick="clearText()">Очистить</button>
        </div>
        <div id="view-mode" class="view-mode">
            <h2 style="margin-bottom: 15px;">📝 Полученный текст:</h2>
            <div id="shared-content" class="shared-content"></div>
            <button class="btn back-btn" onclick="goBack()">← Создать свою ссылку</button>
        </div>
        <div id="result" class="result">
            <strong>Ссылка:</strong>
            <div class="result-text" id="result-text"></div>
            <button class="btn copy-btn" onclick="copyLink()">📋 Копировать</button>
        </div>
    </div>
    <script>
        window.onload = function() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                try {
                    const decoded = decodeURIComponent(escape(atob(hash)));
                    document.getElementById('create-mode').style.display = 'none';
                    document.getElementById('view-mode').classList.add('show');
                    document.getElementById('shared-content').textContent = decoded;
                } catch (e) { alert('Ошибка декодирования'); }
            }
        };
        function createLink() {
            const text = document.getElementById('text-input').value.trim();
            if (!text) { alert('Введи текст'); return; }
            const encoded = btoa(unescape(encodeURIComponent(text)));
            const link = window.location.origin + window.location.pathname + '#' + encoded;
            document.getElementById('result-text').textContent = link;
            document.getElementById('result').classList.add('show');
        }
        function copyLink() {
            const text = document.getElementById('result-text').textContent;
            navigator.clipboard.writeText(text).then(() => alert('Скопировано!')).catch(err => alert('Ошибка копирования'));
        }
        function clearText() {
            document.getElementById('text-input').value = '';
            document.getElementById('result').classList.remove('show');
        }
        function goBack() {
            window.location.hash = '';
            window.location.reload();
        }
    </script>
</body>
</html>
